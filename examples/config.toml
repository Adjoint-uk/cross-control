# cross-control example configuration
# Copy to ~/.config/cross-control/config.toml and adjust to your setup.

[daemon]
port = 24800
bind = "0.0.0.0"
discovery = true       # mDNS auto-discovery; set false on networks that block multicast
log_level = "info"
screen_width = 1920    # this machine's screen size, used for edge detection
screen_height = 1080

[identity]
# This machine's name. Must be unique across your setup and must differ from
# every [[screens]] name below. Defaults to the system hostname if omitted.
name = "workstation-left"

[input]
# Hotkey to release all grabbed devices and return control to local machine.
release_hotkey = ["LeftCtrl", "LeftShift", "Escape"]
# Input backend: "auto" (native: evdev/uinput on Linux), "evdev", or "none"
# (headless: no input devices touched; for smoke tests and CI).
# backend = "auto"

[clipboard]
enabled = true
max_size = 1044480   # bytes; ~1 MiB is also the most one message can carry

# ── Monitors (optional) ──────────────────────────────────────────────────
#
# By default this machine is treated as one screen sized by
# daemon.screen_width/screen_height. For a multi-monitor setup, list each
# monitor with its size and top-left offset (x, y) within the combined
# desktop. Edge detection runs against the union of all monitors, so the
# cursor traverses the whole desktop before crossing to another machine.
#
# Example: two 1920x1080 monitors side by side (a 3840x1080 desktop):
#
# [[monitors]]
# width = 1920
# height = 1080
# x = 0
# y = 0
#
# [[monitors]]
# width = 1920
# height = 1080
# x = 1920
# y = 0

# ── Screen layout ────────────────────────────────────────────────────────
#
# [[screens]] declares a machine placed directly next to THIS one, and which
# edge of this screen the cursor crosses to reach it. `position` is one of
# Left, Right, Above, Below. Each edge can hold at most one direct neighbor.
#
# `address` is optional: with mDNS discovery on, peers are found automatically
# and you only need `position`. Set `address` to pin a static host (or on
# networks without multicast). `fingerprint` pins the peer's TLS cert; the
# alternative is `cross-control pair` / `cross-control trust add`, which record
# trusted peers in the known_peers file instead. A peer is refused unless it is
# trusted one way or the other. `cross-control trust` shows your own.

[[screens]]
name = "laptop-right"
position = "Right"
# address = "192.168.1.42"                 # optional with mDNS
# fingerprint = "SHA256:ab:cd:ef:..."      # set after first pairing

# ── Multi-hop layout (optional) ──────────────────────────────────────────
#
# [[screen_adjacency]] describes edges BETWEEN OTHER screens, so the cursor
# can hop across a chain of machines. Each entry reads: leaving `screen` by
# its `position` edge lands on `neighbor`. Inverse edges are generated
# automatically, so you only list each link once.
#
# Example three-machine row —  [workstation-left] | [laptop-right] | [tablet]:
# the cursor goes left→right off this machine onto laptop-right (above), then
# right again off laptop-right onto tablet.
#
# [[screen_adjacency]]
# screen = "laptop-right"
# neighbor = "tablet"
# position = "Right"

# ── Peer authentication ──────────────────────────────────────────────────
#
# Every connection is mutually authenticated with TLS certificates. A peer
# is accepted when its (name, fingerprint) is pinned above or listed in the
# known_peers file. Manage that file with `cross-control trust`.
#
# [security]
# trust_on_first_use = false   # true: accept and remember unknown peers.
#                              # Anyone who can reach this machine first wins:
#                              # only for networks you fully control.
# known_peers = "/home/me/.config/cross-control/known_peers"   # default
