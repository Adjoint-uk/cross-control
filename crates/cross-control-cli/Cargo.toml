[package]
name = "cross-control-cli"
description = "Command-line interface for cross-control"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[[bin]]
name = "cross-control"
path = "src/main.rs"

# Runs the daemon without a console window (for Windows logon tasks).
[[bin]]
name = "cross-controlw"
path = "src/bin/cross-controlw.rs"

[features]
# Each native backend only takes effect on its own platform.
default = ["linux", "windows"]
linux = ["cross-control-daemon/linux"]
windows = ["cross-control-daemon/windows"]

[dependencies]
cross-control-daemon = { workspace = true }
cross-control-certgen = { workspace = true }
cross-control-clipboard = { workspace = true, features = ["arboard"] }
cross-control-input = { workspace = true }
cross-control-protocol = { workspace = true }
cross-control-types = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
toml = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
hostname = "0.4"

[lints]
workspace = true

[dev-dependencies]
cross-control-daemon = { workspace = true }
cross-control-protocol = { workspace = true }
cross-control-certgen = { workspace = true }
cross-control-types = { workspace = true }
tokio = { workspace = true, features = ["full"] }
rustls = { workspace = true }
