[package]
name = "cross-control-input"
description = "Platform-abstracted input capture and emulation for cross-control"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[features]
# Native Linux backend (evdev/uinput). Has no effect on other targets.
linux = ["dep:evdev"]
mock = []
# Native Windows backend (low-level hooks/SendInput). No effect elsewhere.
windows = ["dep:windows-sys"]
# Native macOS backend (Quartz event taps/event posting). No effect elsewhere.
macos = ["dep:core-graphics", "dep:core-foundation"]
# Tests only: lets the Windows hooks and macOS event tap accept synthetic input tagged with a
# marker, so end-to-end tests can drive real capture. Never enable in
# release builds.
test-support = []

[dependencies]
cross-control-types = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }

[lints]
workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
evdev = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = { workspace = true, optional = true }
core-foundation = { workspace = true, optional = true }
