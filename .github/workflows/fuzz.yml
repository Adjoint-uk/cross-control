name: Fuzz

# Coverage-guided fuzzing of the wire decoder (see fuzz/README.md). Weekly,
# and on demand; a quick deterministic variant runs in every CI build.
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds to run each target
        default: "300"

jobs:
  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [decode_message, decode_control]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      - name: Run ${{ matrix.target }}
        run: |
          cd fuzz
          cargo fuzz run ${{ matrix.target }} -- -max_total_time=${{ github.event.inputs.seconds || '300' }}
      - name: Upload crash reproducers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts
