name: Release

# A pushed tag vX.Y.Z builds every target, smoke-tests the archives, and
# publishes a GitHub release with checksums and build provenance.
#
# The same can be started from the Actions tab ("Run workflow" on main with
# "publish" ticked): the workflow then creates the tag vX.Y.Z itself, for
# the version in the code, on the commit it ran on.
#
# Pull requests that touch the release machinery, and manual runs without
# "publish", are dry runs: everything except publishing.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "scripts/release/**"
      - "install.sh"
      - "install.ps1"
      - "packaging/**"
      - "Formula/**"
      - "bucket/**"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a release (tag vX.Y.Z for the version in the code) — main only"
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NFPM_VERSION: "2.43.0"

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Check the version
        env:
          PUBLISH_INPUT: ${{ inputs.publish }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version=$(python3 scripts/release/release.py version --tag "$GITHUB_REF")
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$PUBLISH_INPUT" == true ]]; then
            if [[ "$GITHUB_REF" != refs/heads/main ]]; then
              echo "::error::Publishing is only allowed from main (ran on $GITHUB_REF)"
              exit 1
            fi
            version=$(python3 scripts/release/release.py version)
            if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
              echo "::error::Tag v$version already exists; bump the version first"
              exit 1
            fi
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            version=$(python3 scripts/release/release.py version)
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"
      - name: Release notes
        run: |
          if [[ "${{ steps.version.outputs.publish }}" == true ]]; then
            python3 scripts/release/release.py notes "${{ steps.version.outputs.version }}" > notes.md
          else
            python3 scripts/release/release.py notes "${{ steps.version.outputs.version }}" --allow-unreleased > notes.md
          fi
          cat notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: notes.md

  build:
    name: Build (${{ matrix.target }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported Ubuntu, for the widest glibc compatibility.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          # Apple silicon runners; the Intel build is cross-compiled there
          # (Rust ad-hoc signs both, as macOS requires to run them).
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked -p cross-control-cli --target ${{ matrix.target }}
      - name: Ad-hoc sign (macOS)
        # macOS only runs signed code on Apple silicon, Intel builds under
        # Rosetta included; the linker signs native arm64 builds but not
        # cross-compiled x86_64 ones.
        if: runner.os == 'macOS'
        run: codesign --force --sign - target/${{ matrix.target }}/release/cross-control
      - name: Package
        shell: bash
        run: |
          python3 scripts/release/release.py package \
            --target ${{ matrix.target }} --version "$VERSION" \
            --bin-dir target/${{ matrix.target }}/release --out dist
      - name: Linux packages (.deb, .rpm)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          case "${{ matrix.target }}" in
            x86_64-*) arch=x86_64; sum=a80d5f724ed70b192ffa8a2bde469c013cef559c8afa3441eb51dd9a918beb6b ;;
            aarch64-*) arch=arm64; sum=cfafa3bee852c45a52f2ebbfb063d715235f934d082dc64301a1b9957f3a4032 ;;
          esac
          curl -fsSL -o "$RUNNER_TEMP/nfpm.tgz" \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_${arch}.tar.gz"
          echo "$sum  $RUNNER_TEMP/nfpm.tgz" | sha256sum --check
          tar xzf "$RUNNER_TEMP/nfpm.tgz" -C "$RUNNER_TEMP" nfpm
          python3 scripts/release/release.py linux-packages \
            --target ${{ matrix.target }} --version "$VERSION" \
            --bin-dir target/${{ matrix.target }}/release --out dist --nfpm "$RUNNER_TEMP/nfpm"
      - name: Install the .deb (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get install -y ./dist/cross-control_*.deb
          test "$(cross-control --version)" = "cross-control $VERSION"
          test -f /usr/lib/udev/rules.d/70-cross-control.rules
          test -f /usr/lib/modules-load.d/cross-control.conf
          sudo apt-get remove -y cross-control
          if command -v cross-control; then echo "still installed after remove"; exit 1; fi
      - name: Install the .rpm (Fedora)
        if: runner.os == 'Linux'
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" -e VERSION fedora:latest sh -euc '
            dnf install -y /dist/cross-control-*.rpm
            test "$(cross-control --version)" = "cross-control $VERSION"
            test -f /usr/lib/udev/rules.d/70-cross-control.rules
            dnf remove -y cross-control
            if command -v cross-control; then echo "still installed after remove"; exit 1; fi'
      - name: Check the binary's architecture (macOS)
        if: runner.os == 'macOS'
        run: |
          arch=${{ matrix.target }}; arch=${arch%%-*}; [ "$arch" = aarch64 ] && arch=arm64
          lipo -archs target/${{ matrix.target }}/release/cross-control | tee /dev/stderr | grep -qx "$arch"
          codesign --verify target/${{ matrix.target }}/release/cross-control
      - name: Smoke-test the archive (Linux, macOS)
        # Only where the binary runs natively (not the Intel macOS build).
        if: runner.os != 'Windows' && matrix.target != 'x86_64-apple-darwin'
        run: |
          set -euo pipefail
          work=$(mktemp -d /tmp/smoke.XXXX)
          tar xzf dist/*.tar.gz -C "$work"
          exe="$work/cross-control-$VERSION-${{ matrix.target }}/cross-control"
          test "$("$exe" --version)" = "cross-control $VERSION"
          export CROSS_CONTROL_CONFIG_DIR="$work/config" CROSS_CONTROL_RUNTIME_DIR="$work/run"
          "$exe" identity --json | python3 -c 'import json,sys; assert json.load(sys.stdin)["fingerprint"].startswith("SHA256:")'
          "$exe" config check "$work/cross-control-$VERSION-${{ matrix.target }}/config.example.toml" --json
      - name: Smoke-test the archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $work = Join-Path $env:RUNNER_TEMP 'smoke'
          Expand-Archive (Get-Item dist/*.zip) -DestinationPath $work
          $pkg = Join-Path $work "cross-control-$env:VERSION-${{ matrix.target }}"
          $version = & "$pkg/cross-control.exe" --version
          if ($version -ne "cross-control $env:VERSION") { throw "unexpected version: $version" }
          if (-not (Test-Path "$pkg/cross-controlw.exe")) { throw 'cross-controlw.exe is missing' }
          $env:CROSS_CONTROL_CONFIG_DIR = Join-Path $work 'config'
          $env:CROSS_CONTROL_RUNTIME_DIR = Join-Path $work 'run'
          # The bundled module installs from the unpacked archive.
          Import-Module "$pkg/CrossControl"
          $installed = Install-CrossControl -Path $pkg -Destination (Join-Path $work 'bin')
          if (-not $installed.Changed) { throw 'install reported no change' }
          $identity = Get-CrossControlIdentity
          if ($identity.fingerprint -notlike 'SHA256:*') { throw 'no fingerprint' }
          & "$pkg/cross-control.exe" config check "$pkg/config.example.toml" --json
          if ($LASTEXITCODE -ne 0) { throw 'the example config does not validate' }
      - name: Serve the archive as a release mirror
        shell: bash
        run: |
          mkdir mirror
          cp dist/*.tar.gz dist/*.zip mirror/ 2>/dev/null || true
          cat dist/*.sha256 > mirror/SHA256SUMS
          cd mirror && nohup python3 -m http.server 18765 --bind 127.0.0.1 > ../mirror.log 2>&1 &
          sleep 2
      - name: install.sh from the archive
        if: runner.os != 'Windows' && matrix.target != 'x86_64-apple-darwin'
        env:
          CROSS_CONTROL_VERSION: ${{ needs.prepare.outputs.version }}
          CROSS_CONTROL_DOWNLOAD_BASE: http://127.0.0.1:18765
          CROSS_CONTROL_INSTALL_DIR: ${{ runner.temp }}/install-sh/bin
          CROSS_CONTROL_SERVICE: "0"
        run: |
          bash install.sh < /dev/null
          test "$("$CROSS_CONTROL_INSTALL_DIR/cross-control" --version)" = "cross-control $VERSION"
      - name: install.ps1 from the archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dest = Join-Path $env:RUNNER_TEMP 'install-ps1'
          ./install.ps1 -Version $env:VERSION -DownloadBase http://127.0.0.1:18765 -Destination $dest
          $version = & (Join-Path $dest 'cross-control.exe') --version
          if ($version -ne "cross-control $env:VERSION") { throw "unexpected version: $version" }
          if (-not (Test-Path (Join-Path $dest 'cross-controlw.exe'))) { throw 'cross-controlw.exe was not installed' }
          Import-Module CrossControl -Force
          if (-not (Get-Command Enable-CrossControlAutostart -ErrorAction SilentlyContinue)) { throw 'the module was not installed' }
      - name: Homebrew formula from the archive
        if: matrix.target == 'aarch64-apple-darwin'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_FROM_API: "1"
          HOMEBREW_NO_ANALYTICS: "1"
        run: |
          set -euo pipefail
          brew tap-new --no-git local/cross-control
          tap="$(brew --repository)/Library/Taps/local/homebrew-cross-control"
          python3 scripts/release/release.py homebrew --version "$VERSION" \
            --sums mirror/SHA256SUMS --base-url http://127.0.0.1:18765 --partial \
            > "$tap/Formula/cross-control.rb"
          brew install local/cross-control/cross-control
          test "$("$(brew --prefix)/bin/cross-control" --version)" = "cross-control $VERSION"
          brew test local/cross-control/cross-control
          brew uninstall cross-control
          brew untap local/cross-control
      - name: Scoop manifest from the archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-RestMethod https://get.scoop.sh -OutFile "$env:RUNNER_TEMP/install-scoop.ps1"
          & "$env:RUNNER_TEMP/install-scoop.ps1" -RunAsAdmin
          $env:PATH = "$env:USERPROFILE\scoop\shims;$env:PATH"
          $manifest = Join-Path $env:RUNNER_TEMP 'cross-control.json'
          python scripts/release/release.py scoop --version $env:VERSION `
            --sums mirror/SHA256SUMS --base-url http://127.0.0.1:18765 |
            Set-Content -Encoding utf8 $manifest
          scoop install $manifest
          $version = cross-control --version
          if ($version -ne "cross-control $env:VERSION") { throw "unexpected version: $version" }
          if (-not (Get-Command cross-controlw -ErrorAction SilentlyContinue)) { throw 'cross-controlw is not on PATH' }
          scoop uninstall cross-control
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*

  installers:
    name: Install scripts
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n install.sh
      - run: shellcheck install.sh packaging/linux/postinstall.sh
      - name: Homebrew formula and Scoop manifest are well-formed
        run: |
          ruby -c Formula/cross-control.rb
          python3 -m json.tool bucket/cross-control.json > /dev/null
      - name: install.ps1 parses
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | Write-Error; exit 1 }

  publish:
    name: Publish
    needs: [prepare, build, installers]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      pull-requests: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
      - name: Checksums
        working-directory: dist
        run: |
          cat *.sha256 > SHA256SUMS
          rm *.sha256
          sha256sum --check SHA256SUMS
          cat SHA256SUMS
      - name: Build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/cross-control*
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          [[ "$VERSION" == *-* ]] && prerelease=(--prerelease)
          # A pushed tag must already exist; a manual run creates it here,
          # on the commit that was built.
          tag=(--verify-tag)
          [[ "$GITHUB_REF" == refs/tags/* ]] || tag=(--target "$GITHUB_SHA")
          gh release create "v$VERSION" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "cross-control $VERSION" \
            --notes-file notes.md \
            "${tag[@]}" "${prerelease[@]}"
      - name: Update the Homebrew formula and Scoop manifest
        # Opens a pull request; merging it is what users of the tap and the
        # bucket pick up. If the repository does not let Actions open pull
        # requests, run the two release.py commands below and commit the
        # result by hand.
        continue-on-error: true
        working-directory: repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/release/release.py homebrew --version "$VERSION" --sums ../dist/SHA256SUMS > Formula/cross-control.rb
          python3 scripts/release/release.py scoop --version "$VERSION" --sums ../dist/SHA256SUMS > bucket/cross-control.json
          if git diff --quiet; then echo "already up to date"; exit 0; fi
          branch="packaging/v$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -am "Homebrew and Scoop: cross-control $VERSION"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Homebrew and Scoop: cross-control $VERSION" \
            --body "Points the Homebrew formula and the Scoop manifest at the v$VERSION release, with its checksums. Generated by the release workflow."
