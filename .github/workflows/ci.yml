name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
      - name: Version numbers agree
        run: python3 scripts/release/release.py version

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  docs:
    name: Docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --all-features

  msrv:
    name: MSRV (1.89)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  ansible:
    name: Ansible role (end-to-end)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ansible-core>=2.15,<2.20"
      - run: cargo build -p cross-control-cli
      - run: deploy/ansible/tests/run.sh

  deny:
    name: Dependencies (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            build-args: "--workspace"
            test-args: "--workspace"
          - os: windows-latest
            build-args: "--workspace"
            test-args: "--workspace"
          - os: macos-latest
            build-args: "--workspace"
            test-args: "--workspace"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build ${{ matrix.build-args }}
      - run: cargo test ${{ matrix.test-args }}
        env:
          # The Windows runner has an interactive desktop: tests that need
          # one must run there, not skip.
          CROSS_CONTROL_REQUIRE_DESKTOP: ${{ matrix.os == 'windows-latest' && '1' || '' }}
      - name: macOS permissions (desktop tests skip without them)
        if: matrix.os == 'macos-latest'
        run: target/debug/cross-control doctor || true
      - name: Logon task end-to-end
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./deploy/windows/tests/logon-task.ps1 -Bin target/debug
      - name: PowerShell module end-to-end (PowerShell 7)
        shell: pwsh
        run: ./deploy/powershell/tests/run.ps1 -Bin target/debug
      - name: PowerShell module end-to-end (Windows PowerShell 5.1)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: ./deploy/powershell/tests/run.ps1 -Bin target/debug
